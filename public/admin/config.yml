# Cult & Crown editor (Sveltia CMS)
# Repository: cultandcrown-ux/cultandcrown-site
# 2. Log in at cultandcrown.com/admin with "Sign in with token" (GitHub personal access token).

backend:
  name: github
  repo: cultandcrown-ux/cultandcrown-site
  branch: main

site_url: https://cultandcrown.com
display_url: https://cultandcrown.com
logo_url: /favicon.png

media_folder: public/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title, category]
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}"
    preview_path: "/articles/{{slug}}/"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: "Short description (shown on cards and Google)", name: description, widget: text }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: "Last updated (optional)", name: updated, widget: datetime, format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "SEO title for Google (optional, max 60 characters)", name: seoTitle, widget: string, required: false }
      - { label: "Quick answer: 2-3 sentences that answer the main question directly (shown at the top, read by Google and AI)", name: summary, widget: text, required: false }
      - label: Category
        name: category
        widget: select
        options:
          - { label: On Screen, value: on-screen }
          - { label: Recast, value: recast }
          - { label: The Collection, value: collection }
          - { label: Features, value: features }
      - { label: "Cover photo (optional: without it the site draws a poster from Film, Year and Watch)", name: cover, widget: image, required: false }
      - { label: "Cover photo description (accessibility and SEO)", name: coverAlt, widget: string, required: false }
      - { label: Film, name: film, widget: string, required: false }
      - { label: Year, name: year, widget: string, required: false }
      - { label: Watch, name: watch, widget: string, required: false }
      - label: "Poster colour (used when there is no photo)"
        name: tone
        widget: select
        default: teal
        options:
          - { label: Teal, value: teal }
          - { label: Noir, value: noir }
          - { label: Sepia, value: sepia }
          - { label: Steel, value: steel }
      - label: "Sources (links to the articles you used)"
        name: sources
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Link, name: url, widget: string }
      - label: "FAQ (shown at the end and marked up for Google)"
        name: faq
        widget: list
        required: false
        fields:
          - { label: Question, name: q, widget: string }
          - { label: Answer, name: a, widget: text }
      - { label: "Featured on the homepage", name: featured, widget: boolean, default: false }
      - { label: "Draft (hidden from the site)", name: draft, widget: boolean, default: false }
      - { label: "Hide from Google (visible on the site, e.g. outlines not yet written)", name: noindex, widget: boolean, default: false }
      - { label: Text, name: body, widget: markdown }
